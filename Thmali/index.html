<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ايجار</title>
<style>
html,body{margin:0;height:100%;background:#eef5f3}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eef5f3}
#ld{position:fixed;inset:0;display:grid;place-items:center;font-family:Tahoma,Arial,sans-serif;color:#6f8a85;font-size:18px;z-index:1}
</style>
</head>
<body>
<div id="ld">⏳ جارٍ التحميل...</div>
<iframe id="f" allow="clipboard-write; fullscreen"></iframe>
<script>
/* غيّر السطر التالي فقط: ضع رابط الموقع الآخر (المنتهي بـ exec) بين علامتي الاقتباس */
var EXEC = 'https://script.google.com/macros/s/AKfycbyx6bwojOgGBPER1QbNImL8wzDsfE-fzV9Od1nkbIemPEoPI3DTRmWj5VbY9gJnAvbmIQ/exec';
var f = document.getElementById('f');
f.onload = function () { var l = document.getElementById('ld'); if (l) l.remove(); };
f.src = EXEC + (location.search || '');
</script>
</body>
</html>
